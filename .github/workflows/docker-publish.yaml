on:
  release:
    types: [published]
  workflow_dispatch:

name: docker-publish

# Builds and pushes the MCView image to Docker Hub, tagged with the package
# version (from DESCRIPTION) and :latest. GitHub-hosted runners use a modern
# Docker, so the standard Dockerfile build works (no seccomp workaround needed).
#
# Requires two repository secrets:
#   DOCKERHUB_USERNAME  - the Docker Hub account/org (e.g. tanaylab)
#   DOCKERHUB_TOKEN     - a Docker Hub access token with write scope
# Set them with:
#   gh secret set DOCKERHUB_USERNAME --body tanaylab
#   gh secret set DOCKERHUB_TOKEN    --body <token>

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read package version
        id: ver
        run: echo "version=$(grep -i '^Version:' DESCRIPTION | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Pin the installed package to the exact commit being built.
          build-args: |
            MCVIEW_REF=${{ github.sha }}
          tags: |
            tanaylab/mcview:${{ steps.ver.outputs.version }}
            tanaylab/mcview:latest
